<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PO / Tax Invoice Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B2A41;
  --ink-soft:#334158;
  --slate:#5B6472;
  --paper:#FBF9F4;
  --paper-line:#E4DFD3;
  --brass:#B08D57;
  --brass-dark:#8C6D3F;
  --panel:#F3F1EC;
  --panel-border:#DCD7CB;
  --white:#FFFFFF;
  --red:#B4483C;
  --green:#2F7355;
  --shadow:0 18px 45px -20px rgba(27,42,65,0.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;
  background:linear-gradient(180deg,#E9E5DA 0%, #DCD6C8 100%);
  color:var(--ink);
  min-height:100vh;
}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 28px;
  background:var(--ink);
  color:var(--paper);
  flex-wrap:wrap;
  gap:12px;
}
.topbar .brand{
  font-family:'Source Serif 4',serif;
  font-weight:700;
  font-size:18px;
  letter-spacing:0.02em;
  display:flex;align-items:center;gap:10px;
}
.brand .mark{
  width:26px;height:26px;border:2px solid var(--brass);
  border-radius:4px;display:inline-flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;color:var(--brass);
}
.doctype-toggle{
  display:flex;background:rgba(255,255,255,0.08);border-radius:999px;padding:4px;gap:4px;
}
.doctype-toggle button{
  border:none;background:transparent;color:rgba(255,255,255,0.65);
  font-family:'Source Serif 4',serif;font-weight:600;font-size:13px;
  padding:8px 16px;border-radius:999px;cursor:pointer;transition:.18s;
  letter-spacing:0.02em;
}
.doctype-toggle button.active{
  background:var(--brass);color:var(--ink);
}
.actions{display:flex;gap:10px;}
.btn{
  font-family:'Source Serif 4',serif;font-weight:600;font-size:13px;
  padding:9px 16px;border-radius:8px;border:1.5px solid transparent;cursor:pointer;
  letter-spacing:0.01em;transition:.15s;
}
.btn-primary{background:var(--brass);color:var(--ink);}
.btn-primary:hover{background:var(--brass-dark);color:var(--white);}
.btn-ghost{background:transparent;color:var(--paper);border-color:rgba(255,255,255,0.35);}
.btn-ghost:hover{border-color:var(--paper);}

.app-shell{
  display:grid;grid-template-columns:420px 1fr;gap:26px;
  padding:26px;align-items:start;
  max-width:1500px;margin:0 auto;
}

/* FORM PANEL */
.form-panel{
  background:var(--panel);
  border:1px solid var(--panel-border);
  border-radius:14px;
  padding:6px 6px 20px;
  max-height:calc(100vh - 110px);
  overflow-y:auto;
}
.section{border-bottom:1px solid var(--panel-border);padding:16px 18px;}
.section:last-child{border-bottom:none;}
.section h3{
  font-family:'Source Serif 4',serif;
  font-size:12.5px;text-transform:uppercase;letter-spacing:0.08em;
  color:var(--brass-dark);margin:0 0 12px;font-weight:700;
  display:flex;align-items:center;gap:8px;
}
.section h3::before{
  content:"";width:6px;height:6px;background:var(--brass);border-radius:50%;
}
.field{margin-bottom:10px;}
.field label{
  display:block;font-size:11.5px;color:var(--slate);margin-bottom:4px;font-weight:500;
}
.field input[type=text],.field input[type=number],.field input[type=date],
.field textarea,.field select{
  width:100%;padding:8px 10px;border:1px solid var(--panel-border);border-radius:7px;
  font-family:'Inter',sans-serif;font-size:13px;background:var(--white);color:var(--ink);
}
.field textarea{resize:vertical;min-height:52px;}
.field input:focus,.field textarea:focus,.field select:focus{
  outline:none;border-color:var(--brass);box-shadow:0 0 0 3px rgba(176,141,87,0.18);
}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.checkline{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--slate);margin:6px 0 4px;}
.checkline input{accent-color:var(--brass);}

.item-card{
  border:1px solid var(--panel-border);border-radius:9px;background:var(--white);
  padding:10px 10px 4px;margin-bottom:10px;position:relative;
}
.item-card .item-num{
  position:absolute;top:-9px;left:10px;background:var(--ink);color:var(--paper);
  font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;font-size:10px;padding:1px 7px;border-radius:5px;
}
.item-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px;}
.item-grid .full{grid-column:1/-1;}
.remove-item{
  position:absolute;top:-9px;right:10px;background:var(--red);color:#fff;border:none;
  border-radius:5px;font-size:10px;padding:1px 7px;cursor:pointer;font-weight:600;
}
.add-item-btn{
  width:100%;padding:9px;border:1.5px dashed var(--brass);border-radius:8px;background:transparent;
  color:var(--brass-dark);font-weight:600;font-size:12.5px;cursor:pointer;font-family:'Source Serif 4',serif;
}
.add-item-btn:hover{background:rgba(176,141,87,0.1);}

/* PREVIEW - classic GST invoice grid style */
.preview-wrap{display:flex;justify-content:center;}
.preview{
  width:100%;max-width:820px;background:#fff;box-shadow:var(--shadow);
  border:1.3px solid #000;border-radius:0;padding:0;position:relative;overflow:hidden;
  font-family:'Inter',sans-serif;color:#111;
}
.doc-title-banner{
  text-align:center;padding:14px 20px 10px;border-bottom:1.3px solid #000;
}
.doc-title-banner .title-text{
  font-family:'Source Serif 4',serif;font-weight:700;font-size:19px;letter-spacing:0.1em;
  color:#000;margin:0;
}
.doc-title-banner .pf-note{
  font-size:10px;color:#444;letter-spacing:0.03em;text-transform:uppercase;font-weight:600;margin-top:3px;
}
.project-note{
  text-align:left;font-size:12px;font-style:italic;color:#222;padding:8px 16px;border-bottom:1.3px solid #000;
}
.head-grid{display:grid;grid-template-columns:1.3fr 1fr;border-bottom:1.3px solid #000;}
.seller-cell{padding:12px 16px;border-right:1.3px solid #000;}
.seller-cell .co-name{font-family:'Source Serif 4',serif;font-weight:700;font-size:16px;margin:0 0 5px;}
.seller-cell .co-meta{font-size:11.5px;line-height:1.55;white-space:pre-line;color:#222;}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;}
.meta-cell{padding:7px 12px;border-bottom:1px solid #ccc;border-right:1px solid #ccc;font-size:11px;color:#333;}
.meta-cell:nth-child(2n){border-right:none;}
.meta-cell b{display:block;font-size:12px;color:#000;font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;font-weight:600;margin-top:2px;}
.parties{display:grid;grid-template-columns:1fr 1fr;border-bottom:1.3px solid #000;}
.party-box{padding:10px 16px;border-right:1.3px solid #000;}
.party-box:last-child{border-right:none;}
.party-box .label{
  font-family:'Source Serif 4',serif;font-size:11px;font-weight:700;margin-bottom:5px;
}
.party-box .name{font-weight:700;font-size:12.5px;margin-bottom:2px;}
.party-box .addr{font-size:11.5px;color:#222;line-height:1.5;white-space:pre-line;}
.party-box .gst{font-size:11px;color:#333;margin-top:5px;font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;}

table.items{width:100%;border-collapse:collapse;font-size:11.5px;}
table.items thead th{
  border-bottom:1.3px solid #000;border-right:1px solid #999;
  font-weight:700;font-size:10.5px;padding:6px 7px;text-align:left;background:#F2F2F2;
}
table.items thead th:last-child{border-right:none;}
table.items thead th.num{text-align:right;}
table.items tbody td{padding:5px 7px;border-bottom:1px solid #ddd;border-right:1px solid #eee;vertical-align:top;}
table.items tbody td:last-child{border-right:none;}
table.items tbody td.num{text-align:right;font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;}
table.items tbody tr.extra-row td{border-top:1px solid #999;font-weight:600;}
table.items tbody tr.total-row td{border-top:1.6px double #000;font-weight:700;font-size:12.5px;}

.words-box{border-bottom:1.3px solid #000;padding:8px 16px;font-size:11.5px;position:relative;}
.words-box .eoe{position:absolute;top:8px;right:16px;font-size:10px;font-style:italic;color:#333;}
.words-box b{font-weight:700;}

table.hsn-summary{width:100%;border-collapse:collapse;font-size:11px;border-bottom:1.3px solid #000;}
table.hsn-summary th,table.hsn-summary td{border:1px solid #999;padding:5px 7px;text-align:right;}
table.hsn-summary th:first-child,table.hsn-summary td:first-child{text-align:left;}
table.hsn-summary th{background:#F2F2F2;font-weight:700;font-size:10px;}
table.hsn-summary tr.total-row td{font-weight:700;border-top:1.6px double #000;}

.tax-words-box{border-bottom:1.3px solid #000;padding:8px 16px;font-size:11.5px;}
.tax-words-box b{font-weight:700;}

.bottom-grid{display:grid;grid-template-columns:1fr 1fr;border-bottom:1.3px solid #000;}
.decl-box{padding:12px 16px;border-right:1.3px solid #000;font-size:11px;color:#222;line-height:1.6;}
.decl-box .label{font-family:'Source Serif 4',serif;font-size:11.5px;font-weight:700;margin-bottom:6px;}
.bank-box{padding:12px 16px;font-size:11.5px;font-weight:700;}
.bank-box .label{font-family:'Source Serif 4',serif;font-size:11.5px;font-weight:700;margin-bottom:6px;}
.bank-box div{margin-bottom:2px;font-weight:700;}
.sign-block{margin-top:34px;text-align:right;font-size:11.5px;}
.sign-block .line{margin-top:38px;padding-top:5px;border-top:1px solid #000;font-weight:600;width:170px;margin-left:auto;text-align:center;}

.footer-note{padding:10px 16px;text-align:center;font-size:10.5px;color:#333;letter-spacing:0.02em;}
.footer-note div:first-child{font-weight:600;margin-bottom:2px;}

@media print{
  body{background:#fff;}
  .topbar,.form-panel{display:none !important;}
  .app-shell{grid-template-columns:1fr;padding:0;}
  .preview-wrap{padding:0;}
  .preview{box-shadow:none;max-width:100%;padding:22px 30px;border-radius:0;}
  @page{size:A4;margin:10mm;}
}
@media (max-width:980px){
  .app-shell{grid-template-columns:1fr;}
  .form-panel{max-height:none;}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="mark">P</span> Document Generator</div>
  <div class="doctype-toggle">
    <button id="btnQT" onclick="setDocType('quotation')">Quotation</button>
    <button id="btnPO" class="active" onclick="setDocType('po')">Purchase Order</button>
    <button id="btnPF" onclick="setDocType('proforma')">Proforma Invoice</button>
    <button id="btnINV" onclick="setDocType('invoice')">Tax Invoice</button>
  </div>
  <div class="actions">
    <input type="file" id="loadFileInput" accept=".json,application/json" style="display:none" onchange="loadData(event)">
    <button class="btn btn-ghost" onclick="document.getElementById('loadFileInput').click()">Load Saved Document</button>
    <button class="btn btn-ghost" onclick="saveData()">Save Document Data</button>
    <button class="btn btn-ghost" onclick="clearForm()">Clear Form</button>
    <button class="btn btn-primary" onclick="window.print()">Print / Save as PDF</button>
  </div>
</div>

<div class="app-shell">
  <!-- FORM PANEL -->
  <div class="form-panel" id="formPanel">

    <div class="section">
      <h3>Your Company</h3>
      <div class="field"><label>Company Name</label><input type="text" id="sellerName" placeholder="Acme Trading Co." value="J D Multitrade" oninput="render()"></div>
      <div class="field"><label>Address</label><textarea id="sellerAddress" placeholder="Street, City, Pincode" oninput="render()">229, Neha Industrial Estate, Near Su-Swagat Hotel, Off. Dattapada Road, Borivali East, Mumbai</textarea></div>
      <div class="row2">
        <div class="field"><label>State</label><input type="text" id="sellerState" placeholder="Maharashtra" value="Maharashtra" oninput="render()"></div>
        <div class="field"><label>GSTIN</label><input type="text" id="sellerGSTIN" placeholder="27ABCDE1234F1Z5" value="27BBHPM0621E1Z2" oninput="render()"></div>
      </div>
      <div class="field"><label>Phone</label><input type="text" id="sellerPhone" oninput="render()"></div>
      <div class="field"><label>Email</label><input type="text" id="sellerEmail" oninput="render()"></div>
      <div class="field"><label>Jurisdiction (for footer, e.g. Mumbai)</label><input type="text" id="sellerJurisdiction" placeholder="Mumbai" value="Mumbai" oninput="render()"></div>
    </div>

    <div class="section">
      <h3 id="buyerHeading">Vendor / Buyer</h3>
      <div class="field"><label>Name</label><input type="text" id="buyerName" placeholder="Buyer / vendor company name" oninput="render()"></div>
      <div class="field"><label>Billing Address</label><textarea id="buyerBilling" oninput="render(); syncShipping();"></textarea></div>
      <div class="checkline"><input type="checkbox" id="sameAsBilling" checked onchange="syncShipping()"> Shipping address same as billing</div>
      <div class="field"><label>Shipping Address</label><textarea id="buyerShipping" oninput="render()" disabled></textarea></div>
      <div class="row2">
        <div class="field"><label>State</label><input type="text" id="buyerState" placeholder="Maharashtra" oninput="render()"></div>
        <div class="field"><label>GSTIN</label><input type="text" id="buyerGSTIN" oninput="render()"></div>
      </div>
    </div>

    <div class="section">
      <h3>Document Details</h3>
      <div class="row2">
        <div class="field"><label id="lblDocNo">PO No.</label><input type="text" id="docNumber" placeholder="PO-2026-001" oninput="render()"></div>
        <div class="field"><label id="lblDocDate">PO Date</label><input type="date" id="docDate" oninput="render()"></div>
      </div>
      <div class="row2">
        <div class="field"><label id="lblDate2">Expected Delivery</label><input type="date" id="date2" oninput="render()"></div>
        <div class="field"><label id="lblRef">Quotation Ref.</label><input type="text" id="refNumber" oninput="render()"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Payment Terms</label><input type="text" id="paymentTerms" placeholder="Net 30" oninput="render()"></div>
        <div class="field"><label>Place of Supply</label><input type="text" id="placeOfSupply" oninput="render()"></div>
      </div>
      <div class="field"><label>Project / Work Description (shown above the details grid)</label><input type="text" id="projectNote" placeholder="e.g. Preparation for MB call centre area and terrace cafeteria." oninput="render()"></div>
    </div>

    <div class="section">
      <h3>Materials / Items</h3>
      <div id="itemsContainer"></div>
      <button class="add-item-btn" onclick="addItem()">+ Add Item</button>
    </div>

    <div class="section">
      <h3>Additional Charges (optional)</h3>
      <div class="field"><label>Description</label><input type="text" id="otherChargeDesc" placeholder="Transportation Charges" oninput="render()"></div>
      <div class="row2">
        <div class="field"><label>Amount (₹)</label><input type="number" min="0" step="any" id="otherChargeAmount" value="0" oninput="render()"></div>
        <div class="field"><label>Tax %</label>
          <select id="otherChargeTax" onchange="render()">
            <option value="0">0%</option><option value="5">5%</option><option value="12">12%</option>
            <option value="18" selected>18%</option><option value="28">28%</option>
          </select>
        </div>
      </div>
    </div>

    <div class="section" id="bankSection">
      <h3>Bank Details</h3>
      <div class="row2">
        <div class="field"><label>Bank Name</label><input type="text" id="bankName" value="HDFC Bank Ltd" oninput="render()"></div>
        <div class="field"><label>Branch</label><input type="text" id="bankBranch" value="BORIVALI WEST" oninput="render()"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Account No.</label><input type="text" id="bankAccNo" value="50200026423041" oninput="render()"></div>
        <div class="field"><label>IFSC</label><input type="text" id="bankIFSC" value="HDFC0000546" oninput="render()"></div>
      </div>
      <div class="field"><label>Account Name</label><input type="text" id="bankAccName" value="J D Multitrade" oninput="render()"></div>
    </div>

    <div class="section">
      <h3>Terms &amp; Notes</h3>
      <div class="field"><textarea id="termsText" style="min-height:90px;" oninput="render()">We declare that this invoice shows the actual price of the goods described and that all particulars are true and correct.</textarea></div>
      <div class="field"><label>Authorised Signatory Name (optional)</label><input type="text" id="signatoryName" oninput="render()"></div>
      <div class="checkline"><input type="checkbox" id="roundOff" checked onchange="render()"> Round off grand total</div>
    </div>

  </div>

  <!-- PREVIEW -->
  <div class="preview-wrap">
    <div class="preview" id="preview"></div>
  </div>
</div>

<script>
let docType = 'po';
let items = [];
let itemSeq = 0;

const TAX_OPTIONS = [0,5,12,18,28];
const UNIT_OPTIONS = ["Nos","Kg","Ltr","Box","Set","Meter","Sqrft","Pcs","Ton","Other"];

function newItem(){
  itemSeq++;
  return {id:itemSeq, description:'', hsn:'', pack:'', unit:'Nos', qty:1, rate:0, discount:0, tax:18};
}

function addItem(){
  items.push(newItem());
  renderItemForm();
  render();
}

function removeItem(id){
  items = items.filter(i=>i.id!==id);
  if(items.length===0) items.push(newItem());
  renderItemForm();
  render();
}

function updateItem(id, field, value){
  const it = items.find(i=>i.id===id);
  if(!it) return;
  if(['qty','rate','discount','tax'].includes(field)) value = parseFloat(value)||0;
  it[field] = value;
  render();
}

function renderItemForm(){
  const c = document.getElementById('itemsContainer');
  c.innerHTML = items.map((it,idx)=>`
    <div class="item-card">
      <div class="item-num">Item ${idx+1}</div>
      ${items.length>1?`<button class="remove-item" onclick="removeItem(${it.id})">Remove</button>`:''}
      <div class="field full" style="margin-top:6px;">
        <label>Description</label>
        <input type="text" value="${escapeAttr(it.description)}" oninput="updateItem(${it.id},'description',this.value)" placeholder="Material / product description">
      </div>
      <div class="item-grid">
        <div class="field"><label>HSN / SAC</label><input type="text" value="${escapeAttr(it.hsn)}" oninput="updateItem(${it.id},'hsn',this.value)"></div>
        <div class="field"><label>Pack Size</label><input type="text" value="${escapeAttr(it.pack)}" placeholder="e.g. 20 Ltr" oninput="updateItem(${it.id},'pack',this.value)"></div>
        <div class="field"><label>Unit</label>
          <select onchange="updateItem(${it.id},'unit',this.value)">
            ${UNIT_OPTIONS.map(u=>`<option value="${u}" ${u===it.unit?'selected':''}>${u}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>Qty</label><input type="number" min="0" step="any" value="${it.qty}" oninput="updateItem(${it.id},'qty',this.value)"></div>
        <div class="field"><label>Rate (₹)</label><input type="number" min="0" step="any" value="${it.rate}" oninput="updateItem(${it.id},'rate',this.value)"></div>
        <div class="field"><label>Discount %</label><input type="number" min="0" max="100" step="any" value="${it.discount}" oninput="updateItem(${it.id},'discount',this.value)"></div>
        <div class="field"><label>Tax %</label>
          <select onchange="updateItem(${it.id},'tax',this.value)">
            ${TAX_OPTIONS.map(t=>`<option value="${t}" ${t===it.tax?'selected':''}>${t}%</option>`).join('')}
          </select>
        </div>
      </div>
    </div>
  `).join('');
}

function escapeAttr(s){
  return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}
function escapeHtml(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function setDocType(t){
  docType = t;
  document.getElementById('btnQT').classList.toggle('active', t==='quotation');
  document.getElementById('btnPO').classList.toggle('active', t==='po');
  document.getElementById('btnPF').classList.toggle('active', t==='proforma');
  document.getElementById('btnINV').classList.toggle('active', t==='invoice');
  const isInv = t==='invoice';
  const isPF = t==='proforma';
  const isQT = t==='quotation';
  document.getElementById('buyerHeading').textContent = (isInv||isPF) ? 'Bill To' : isQT ? 'Quotation To' : 'Vendor / Buyer';
  document.getElementById('lblDocNo').textContent = isInv ? 'Invoice No.' : isPF ? 'Proforma No.' : isQT ? 'Quotation No.' : 'PO No.';
  document.getElementById('lblDocDate').textContent = isInv ? 'Invoice Date' : isPF ? 'Proforma Date' : isQT ? 'Quotation Date' : 'PO Date';
  document.getElementById('lblDate2').textContent = isInv ? 'Due Date' : (isPF||isQT) ? 'Valid Until' : 'Expected Delivery';
  document.getElementById('lblRef').textContent = isInv ? 'Against PO No.' : isPF ? 'Reference No.' : isQT ? 'Enquiry Ref.' : 'Quotation Ref.';
  if(!document.getElementById('termsText').value){
    document.getElementById('termsText').value = isInv
      ? "Payment due within the agreed credit period. Goods once sold will not be taken back. Subject to jurisdiction of local courts only."
      : isPF
      ? "This is a Proforma Invoice for reference and quotation purposes only. It is not a demand for payment and is not valid for claiming input tax credit. Prices and taxes shown are estimates, valid until the date mentioned above, and subject to change."
      : isQT
      ? "This quotation is valid until the date mentioned above. Prices, taxes and availability are subject to change without prior notice. Please confirm the order in writing to proceed."
      : "Please deliver as per the specifications and quantities listed above. Any deviation must be approved in writing before dispatch.";
  }
  render();
}

function syncShipping(){
  const same = document.getElementById('sameAsBilling').checked;
  const ship = document.getElementById('buyerShipping');
  ship.disabled = same;
  if(same) ship.value = document.getElementById('buyerBilling').value;
  render();
}

/* ---- Number to words (Indian numbering system) ---- */
function numberToWords(num){
  num = Math.round(num);
  if(num===0) return "Zero";
  const ones=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten",
    "Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
  const tens=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  function twoDigits(n){
    if(n<20) return ones[n];
    return tens[Math.floor(n/10)] + (n%10? " "+ones[n%10]:"");
  }
  function threeDigits(n){
    let s="";
    if(n>=100){ s += ones[Math.floor(n/100)] + " Hundred "; n%=100; }
    s += twoDigits(n);
    return s.trim();
  }
  let crore = Math.floor(num/10000000); num%=10000000;
  let lakh = Math.floor(num/100000); num%=100000;
  let thousand = Math.floor(num/1000); num%=1000;
  let rest = num;
  let parts=[];
  if(crore) parts.push(threeDigits(crore)+" Crore");
  if(lakh) parts.push(threeDigits(lakh)+" Lakh");
  if(thousand) parts.push(threeDigits(thousand)+" Thousand");
  if(rest) parts.push(threeDigits(rest));
  return parts.join(" ").trim();
}

function fmt(n){
  return (n<0?"-":"") + Math.abs(n).toLocaleString('en-IN',{minimumFractionDigits:2, maximumFractionDigits:2});
}

function render(){
  const S = id => document.getElementById(id).value || '';
  const isInv = docType==='invoice';
  const isPF = docType==='proforma';
  const isQT = docType==='quotation';
  const isPO = docType==='po';
  const docLabel = isInv ? 'Invoice' : isPF ? 'Proforma' : isQT ? 'Quotation' : 'PO';
  const date2Label = isInv ? 'Due Date' : (isPF||isQT) ? 'Valid Until' : 'Expected Delivery';
  const refLabel = isInv ? 'Against PO No.' : isPF ? 'Reference No.' : isQT ? 'Enquiry Ref.' : 'Quotation Ref.';

  // items calc
  let subtotal=0, discountTotal=0, taxTotal=0;
  const rows = items.map(it=>{
    const gross = it.qty*it.rate;
    const discAmt = gross*(it.discount/100);
    const taxable = gross-discAmt;
    const taxAmt = taxable*(it.tax/100);
    subtotal+=gross; discountTotal+=discAmt; taxTotal+=taxAmt;
    return {...it, gross, discAmt, taxable, taxAmt, total:taxable+taxAmt};
  });

  // other / additional charges (e.g. transportation) — taxable, added to base
  const ocDesc = S('otherChargeDesc');
  const ocAmount = parseFloat(document.getElementById('otherChargeAmount').value)||0;
  const ocTax = parseFloat(document.getElementById('otherChargeTax').value)||0;
  const ocTaxAmt = ocAmount*(ocTax/100);
  const hasOtherCharge = ocDesc && ocAmount>0;
  if(hasOtherCharge){ taxTotal += ocTaxAmt; }

  const taxableAmount = (subtotal - discountTotal) + (hasOtherCharge?ocAmount:0);

  const sellerState = S('sellerState').trim().toLowerCase();
  const buyerState = S('buyerState').trim().toLowerCase();
  const intraState = sellerState && buyerState && sellerState===buyerState;
  let cgstTotal=0, sgstTotal=0, igstTotal=0;
  if(intraState){ cgstTotal = taxTotal/2; sgstTotal = taxTotal/2; } else { igstTotal = taxTotal; }

  let grandTotalRaw = taxableAmount + taxTotal;
  const doRound = document.getElementById('roundOff').checked;
  const roundedTotal = doRound ? Math.round(grandTotalRaw) : grandTotalRaw;
  const roundOffAmt = roundedTotal - grandTotalRaw;

  const title = isInv ? "TAX INVOICE" : isPF ? "PROFORMA INVOICE" : isQT ? "QUOTATION" : "PURCHASE ORDER";
  const isFullDoc = isInv || isPF; // full GST tax-document treatment (HSN summary, declaration, bank details)
  const partyLabel = isPO ? "Supplier / Vendor" : isQT ? "To" : "Buyer (Bill To)";
  const shipLabel = "Consignee (Ship To)";

  // total qty (only shown if all items share the same unit)
  const totalQty = rows.reduce((s,r)=>s+r.qty,0);
  const sameUnit = rows.length && rows.every(r=>r.unit===rows[0].unit);

  // HSN-wise summary (group by HSN code; other charges get their own row)
  const hsnMap = {};
  rows.forEach(r=>{
    const key = r.hsn || '—';
    if(!hsnMap[key]) hsnMap[key] = {hsn:key, taxable:0, tax:0, rate:r.tax};
    hsnMap[key].taxable += r.taxable;
    hsnMap[key].tax += r.taxAmt;
  });
  if(hasOtherCharge){
    const key = 'Other Charges';
    if(!hsnMap[key]) hsnMap[key] = {hsn:key, taxable:0, tax:0, rate:ocTax};
    hsnMap[key].taxable += ocAmount;
    hsnMap[key].tax += ocTaxAmt;
  }
  const hsnRows = Object.values(hsnMap);

  const html = `
    <div class="doc-title-banner">
      <div class="title-text">${title}</div>
      ${isPF?`<div class="pf-note">For reference &amp; quotation purposes only</div>`:''}
      ${isQT?`<div class="pf-note">Offer valid until the date mentioned below</div>`:''}
    </div>

    <div class="head-grid">
      <div class="seller-cell">
        <div class="co-name">${escapeHtml(S('sellerName')) || 'Your Company Name'}</div>
        <div class="co-meta">${escapeHtml(S('sellerAddress'))}${S('sellerState')?"\nState: "+escapeHtml(S('sellerState')):''}
GSTIN/UIN: ${escapeHtml(S('sellerGSTIN'))||'—'}
${S('sellerPhone')?('Ph: '+escapeHtml(S('sellerPhone'))+'  '):''}${S('sellerEmail')?escapeHtml(S('sellerEmail')):''}</div>
      </div>
      <div class="meta-grid">
        <div class="meta-cell">${docLabel} No.<b>${escapeHtml(S('docNumber'))||'—'}</b></div>
        <div class="meta-cell">${docLabel} Date<b>${S('docDate')||'—'}</b></div>
        <div class="meta-cell">${date2Label}<b>${S('date2')||'—'}</b></div>
        <div class="meta-cell">${refLabel}<b>${escapeHtml(S('refNumber'))||'—'}</b></div>
        <div class="meta-cell">Payment Terms<b>${escapeHtml(S('paymentTerms'))||'—'}</b></div>
        <div class="meta-cell">Place of Supply<b>${escapeHtml(S('placeOfSupply'))||'—'}</b></div>
      </div>
    </div>

    <div class="parties" style="${isFullDoc?'':'grid-template-columns:1fr;'}">
      ${isFullDoc?`
      <div class="party-box">
        <div class="label">${shipLabel}</div>
        <div class="name">${escapeHtml(S('buyerName'))||'—'}</div>
        <div class="addr">${escapeHtml(S('buyerShipping'))||escapeHtml(S('buyerBilling'))}</div>
        <div class="gst">GSTIN/UIN: ${escapeHtml(S('buyerGSTIN'))||'—'}<br>State: ${escapeHtml(S('buyerState'))||'—'}</div>
      </div>`:''}
      <div class="party-box">
        <div class="label">${partyLabel}</div>
        <div class="name">${escapeHtml(S('buyerName'))||'—'}</div>
        <div class="addr">${escapeHtml(S('buyerBilling'))}</div>
        <div class="gst">GSTIN/UIN: ${escapeHtml(S('buyerGSTIN'))||'—'}<br>State: ${escapeHtml(S('buyerState'))||'—'}</div>
      </div>
    </div>

    ${S('projectNote')?`<div class="project-note">${escapeHtml(S('projectNote'))}</div>`:''}

    <table class="items">
      <thead>
        <tr>
          <th>Sl No.</th><th>Description of Goods</th><th>HSN/SAC</th><th>Pack Size</th>
          <th class="num">Quantity</th><th class="num">Rate</th><th>per</th><th class="num">Disc %</th>
          <th class="num">Amount</th>
        </tr>
      </thead>
      <tbody>
        ${rows.map((r,i)=>`
          <tr>
            <td>${i+1}</td>
            <td>${escapeHtml(r.description)||'—'}</td>
            <td>${escapeHtml(r.hsn)||'—'}</td>
            <td>${escapeHtml(r.pack)||'—'}</td>
            <td class="num">${r.qty.toLocaleString('en-IN')}</td>
            <td class="num">${fmt(r.rate)}</td>
            <td>${r.unit}</td>
            <td class="num">${r.discount?r.discount+'%':'—'}</td>
            <td class="num">${fmt(r.taxable)}</td>
          </tr>`).join('')}
        ${hasOtherCharge?`
        <tr class="extra-row">
          <td></td><td>${escapeHtml(ocDesc)}</td><td></td><td></td><td class="num"></td><td class="num"></td><td></td><td class="num"></td>
          <td class="num">${fmt(ocAmount)}</td>
        </tr>`:''}
        ${intraState?`
        <tr class="extra-row"><td colspan="8">Output CGST</td><td class="num">${fmt(cgstTotal)}</td></tr>
        <tr class="extra-row"><td colspan="8">Output SGST</td><td class="num">${fmt(sgstTotal)}</td></tr>
        `:`
        <tr class="extra-row"><td colspan="8">Output IGST</td><td class="num">${fmt(igstTotal)}</td></tr>
        `}
        ${doRound?`<tr class="extra-row"><td colspan="8">Round Off</td><td class="num">${roundOffAmt>=0?'+':''}${fmt(roundOffAmt)}</td></tr>`:''}
        <tr class="total-row">
          <td colspan="4">Total</td>
          <td class="num">${sameUnit?totalQty.toLocaleString('en-IN'):''}</td>
          <td colspan="3">${sameUnit?rows[0].unit:''}</td>
          <td class="num">₹ ${fmt(roundedTotal)}</td>
        </tr>
      </tbody>
    </table>

    <div class="words-box">
      ${isFullDoc?`<span class="eoe">E. &amp; O.E</span>`:''}
      Amount Chargeable (in words)<br>
      <b>INR ${numberToWords(roundedTotal)} Only</b>
    </div>

    ${(isFullDoc && hsnRows.length)?`
    <table class="hsn-summary">
      <thead>
        <tr>
          <th rowspan="1">HSN/SAC</th><th>Taxable Value</th>
          ${intraState?`<th>CGST Rate</th><th>CGST Amount</th><th>SGST/UTGST Rate</th><th>SGST Amount</th>`:`<th>IGST Rate</th><th>IGST Amount</th>`}
          <th>Total Tax Amount</th>
        </tr>
      </thead>
      <tbody>
        ${hsnRows.map(h=>`
          <tr>
            <td>${escapeHtml(h.hsn)}</td>
            <td>${fmt(h.taxable)}</td>
            ${intraState?`
            <td>${(h.rate/2)}%</td><td>${fmt(h.tax/2)}</td><td>${(h.rate/2)}%</td><td>${fmt(h.tax/2)}</td>
            `:`
            <td>${h.rate}%</td><td>${fmt(h.tax)}</td>
            `}
            <td>${fmt(h.tax)}</td>
          </tr>`).join('')}
        <tr class="total-row">
          <td>Total</td>
          <td>${fmt(hsnRows.reduce((s,h)=>s+h.taxable,0))}</td>
          ${intraState?`<td></td><td>${fmt(hsnRows.reduce((s,h)=>s+h.tax/2,0))}</td><td></td><td>${fmt(hsnRows.reduce((s,h)=>s+h.tax/2,0))}</td>`:`<td></td><td>${fmt(hsnRows.reduce((s,h)=>s+h.tax,0))}</td>`}
          <td>${fmt(hsnRows.reduce((s,h)=>s+h.tax,0))}</td>
        </tr>
      </tbody>
    </table>
    <div class="tax-words-box">Tax Amount (in words): <b>INR ${numberToWords(taxTotal)} Only</b></div>
    `:''}

    <div class="bottom-grid" style="${isFullDoc?'':'grid-template-columns:1fr 1fr;'}">
      <div class="decl-box">
        <div class="label">${isFullDoc?'Declaration':'Terms &amp; Conditions'}</div>
        ${escapeHtml(S('termsText'))}
      </div>
      <div class="bank-box">
        <div class="label">Company's Bank Details</div>
        <div>Bank Name: ${escapeHtml(S('bankName'))||'—'}</div>
        <div>A/c Name: ${escapeHtml(S('bankAccName'))||'—'}</div>
        <div>A/c No.: ${escapeHtml(S('bankAccNo'))||'—'}</div>
        <div>Branch &amp; IFS Code: ${escapeHtml(S('bankBranch'))||'—'}${S('bankIFSC')?(' & '+escapeHtml(S('bankIFSC'))):''}</div>
        <div class="sign-block">
          <div>for ${escapeHtml(S('sellerName'))||'Your Company Name'}</div>
          <div class="line">${escapeHtml(S('signatoryName'))||'Authorised Signatory'}</div>
        </div>
      </div>
    </div>

    <div class="footer-note">
      ${S('sellerJurisdiction')?`<div>SUBJECT TO ${escapeHtml(S('sellerJurisdiction')).toUpperCase()} JURISDICTION</div>`:''}
      <div style="font-weight:400;">This is a Computer Generated ${title}</div>
    </div>
  `;
  document.getElementById('preview').innerHTML = html;
}

function val(id){ const el = document.getElementById(id); return el ? (el.value||'') : ''; }
function setVal(id, v){ const el = document.getElementById(id); if(el) el.value = v||''; }

function saveData(){
  const data = {
    docType,
    seller: {
      sellerName:val('sellerName'), sellerAddress:val('sellerAddress'), sellerState:val('sellerState'),
      sellerGSTIN:val('sellerGSTIN'), sellerPhone:val('sellerPhone'),
      sellerEmail:val('sellerEmail'), sellerJurisdiction:val('sellerJurisdiction')
    },
    buyer: {
      buyerName:val('buyerName'), buyerBilling:val('buyerBilling'),
      sameAsBilling:document.getElementById('sameAsBilling').checked,
      buyerShipping:val('buyerShipping'), buyerState:val('buyerState'), buyerGSTIN:val('buyerGSTIN')
    },
    docMeta: {
      docNumber:val('docNumber'), docDate:val('docDate'), date2:val('date2'), refNumber:val('refNumber'),
      paymentTerms:val('paymentTerms'), placeOfSupply:val('placeOfSupply')
    },
    items: items.map(it=>({description:it.description, hsn:it.hsn, pack:it.pack, unit:it.unit, qty:it.qty, rate:it.rate, discount:it.discount, tax:it.tax})),
    otherCharge: { desc:val('otherChargeDesc'), amount:document.getElementById('otherChargeAmount').value, tax:document.getElementById('otherChargeTax').value },
    bank: { name:val('bankName'), branch:val('bankBranch'), accNo:val('bankAccNo'), ifsc:val('bankIFSC'), accName:val('bankAccName') },
    terms: val('termsText'),
    signatoryName: val('signatoryName'),
    roundOff: document.getElementById('roundOff').checked
  };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const fname = (data.docMeta.docNumber || (docType+'-document')).replace(/[^a-z0-9-_]/gi,'_');
  a.download = fname + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function loadData(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    let data;
    try{ data = JSON.parse(e.target.result); }
    catch(err){ alert('Could not read this file. Please choose a .json file that was saved from this tool using "Save Document Data".'); event.target.value=''; return; }

    setVal('sellerName', data.seller && data.seller.sellerName);
    setVal('sellerAddress', data.seller && data.seller.sellerAddress);
    setVal('sellerState', data.seller && data.seller.sellerState);
    setVal('sellerGSTIN', data.seller && data.seller.sellerGSTIN);
    setVal('sellerPhone', data.seller && data.seller.sellerPhone);
    setVal('sellerEmail', data.seller && data.seller.sellerEmail);
    setVal('sellerJurisdiction', data.seller && data.seller.sellerJurisdiction);

    setVal('buyerName', data.buyer && data.buyer.buyerName);
    setVal('buyerBilling', data.buyer && data.buyer.buyerBilling);
    setVal('buyerState', data.buyer && data.buyer.buyerState);
    setVal('buyerGSTIN', data.buyer && data.buyer.buyerGSTIN);
    const same = !(data.buyer && data.buyer.sameAsBilling===false);
    document.getElementById('sameAsBilling').checked = same;
    document.getElementById('buyerShipping').disabled = same;
    if(!same) setVal('buyerShipping', data.buyer && data.buyer.buyerShipping);

    setVal('docNumber', data.docMeta && data.docMeta.docNumber);
    setVal('docDate', data.docMeta && data.docMeta.docDate);
    setVal('date2', data.docMeta && data.docMeta.date2);
    setVal('refNumber', data.docMeta && data.docMeta.refNumber);
    setVal('paymentTerms', data.docMeta && data.docMeta.paymentTerms);
    setVal('placeOfSupply', data.docMeta && data.docMeta.placeOfSupply);

    itemSeq = 0;
    items = (data.items||[]).map(it=>{
      itemSeq++;
      return {id:itemSeq, description:it.description||'', hsn:it.hsn||'', pack:it.pack||'', unit:it.unit||'Nos',
        qty:parseFloat(it.qty)||0, rate:parseFloat(it.rate)||0, discount:parseFloat(it.discount)||0, tax:parseFloat(it.tax)||0};
    });
    if(items.length===0) items=[newItem()];
    renderItemForm();

    setVal('otherChargeDesc', data.otherCharge && data.otherCharge.desc);
    document.getElementById('otherChargeAmount').value = (data.otherCharge && data.otherCharge.amount) || 0;
    document.getElementById('otherChargeTax').value = (data.otherCharge && data.otherCharge.tax) || '18';

    setVal('bankName', data.bank && data.bank.name);
    setVal('bankBranch', data.bank && data.bank.branch);
    setVal('bankAccNo', data.bank && data.bank.accNo);
    setVal('bankIFSC', data.bank && data.bank.ifsc);
    setVal('bankAccName', data.bank && data.bank.accName);

    setVal('termsText', data.terms);
    setVal('signatoryName', data.signatoryName);
    document.getElementById('roundOff').checked = data.roundOff !== false;

    setDocType(data.docType || 'po');
    if(same) syncShipping(); else render();

    event.target.value = '';
  };
  reader.readAsText(file);
}

function clearForm(){
  if(!confirm("Clear all fields and start over?")) return;
  document.querySelectorAll('#formPanel input[type=text], #formPanel input[type=date], #formPanel input[type=number], #formPanel textarea').forEach(el=>el.value='');
  document.getElementById('sameAsBilling').checked = true;
  document.getElementById('buyerShipping').disabled = true;
  document.getElementById('roundOff').checked = true;
  document.getElementById('otherChargeTax').value = '18';
  items = [newItem()];
  renderItemForm();
  setDocType(docType);
}

// init
itemSeq = 1;
itemSeq = 1;
items = [newItem()];
renderItemForm();
setDocType('proforma');
syncShipping();
</script>
